[package]
name = "pi-transfuse"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Session converter between DeepSeek Harness (DSH) logs and Oh My Pi (OMP/pi) transcripts, with a one-way Claude Code import into Pi and a Ratatui browser."
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "pi-transfuse"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
walkdir = "2"
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
